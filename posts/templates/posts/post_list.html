
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Blog</title>
</head>
<body>
    <h1>Mi Blog</h1>

    {% for post in posts %}
        <article>
<h2>{{ post.titulo }}</h2>
<p>{{ post.contenido }}</p>
        </article>
    {% empty %}
        <p>No hay publicaciones todavía.</p>
    {% endfor %}
</body>
</html>
